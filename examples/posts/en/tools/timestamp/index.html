<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Timestamp converter</title><link rel="stylesheet" href="./style.css"><script defer src="./app.js"></script></head>
<body><main><h1>Timestamp converter</h1><p>Convert an integer Unix timestamp to UTC and local time.</p><label for="timestamp">Timestamp</label><input id="timestamp" inputmode="numeric" value="0"><fieldset><legend>Unit</legend><label><input type="radio" name="unit" value="s" checked>Seconds</label><label><input type="radio" name="unit" value="ms">Milliseconds</label></fieldset><button id="convert" type="button">Convert</button><button id="now" type="button">Use current time</button><output id="result" aria-live="polite" data-invalid="Enter an integer timestamp within the supported range."></output></main></body>
</html>
