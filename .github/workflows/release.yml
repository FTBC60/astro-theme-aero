name: Publish theme package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: theme-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Match the tag to the package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== `v${version}`) throw new Error('Tag must match package.json version');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run export:release
      - run: node .github/scripts/verify-theme.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: author-theme-package
          path: |
            release/*-theme.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: author-theme-package
          path: release
      - name: Publish the verified author theme package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          **博客作者请下载下方的 `*-theme.tar.gz` 主题包。**
          **Blog authors: download the `*-theme.tar.gz` theme package below.**

          GitHub 自动附带的 “Source code” 是完整仓库快照，包含开发资料，不是面向博客作者的主题包。
          GitHub's automatic “Source code” archives are full repository snapshots with developer materials.

          解压主题包后进入 `astro-theme-aero/`，运行 `npm ci` 和 `npm run dev`，按中英文文档配置博客。
          Extract the theme package, enter `astro-theme-aero/`, run `npm ci` and `npm run dev`, and follow the included guides.

          本版播放器新增完整音频 Blob 播放、单首预取与 Media Session 系统媒体控件。网页与系统控件共用播放、暂停、上一首、下一首和定位入口，歌单选曲立即响应。

          The player now downloads complete audio into temporary Blobs, prefetches one upcoming track during playback, and integrates Media Session controls. Web and system controls share play, pause, previous/next, and seeking actions. Manual track selection starts immediately.

          初次播放需要等待完整下载和音频初始化。会话保留当前歌曲及最多一首候选，切歌和销毁时取消过期任务、释放旧 Blob URL。加载期间显示 Aero 加载圈，失败后可手动重试，站内切页继续复用播放器及有效任务。

          Initial playback waits for the complete download and audio initialization. The session holds the current track and at most one candidate, cancels obsolete work, and releases old Blob URLs on track changes and disposal. An Aero loading indicator and retry feedback reflect resource state, and playback survives internal navigation.

          系统媒体动作按浏览器能力启用。外链音频需要允许 CORS，完整下载与预取会增加流量和临时内存占用。Safari 可能需要在下载完成后再次点击播放。原型的 iPhone Safari 后台预取和衔接已有实机反馈，最终整合版的 Chrome 系统控件及 iPhone Safari 整体验收仍按 ADR-0017 的第 5 阶段安排。

          System actions depend on browser support. External audio must allow CORS, and full downloads plus prefetching consume bandwidth and temporary memory. Safari may require another play gesture after downloading. Prototype iPhone Safari background-prefetch and continuation results are recorded, while the final integrated Chrome system-control and iPhone Safari acceptance remains scheduled in phase 5 of ADR-0017.

          升级后运行 npm ci，并从实际使用的同一份主题源码重建 Publisher 镜像，以匹配 package 文件。播放器设置继续使用现有音乐配置和静态歌单。

          After upgrading, run npm ci and rebuild the Publisher image from the exact theme source in use so the package files match. Continue using the existing music configuration and static playlist.

          The theme package follows ADR-0013: production theme/tools, default assets, author examples and guides; no tests, CI files or developer maintenance records. Verify the download with `SHA256SUMS.txt`.
          NOTES
          flags=(--verify-tag --title "Astro Theme Aero ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to overwrite published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*-theme.tar.gz SHA256SUMS.txt "${flags[@]}"
