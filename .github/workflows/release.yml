name: Publish theme package

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to build (for example v1.4.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: theme-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
      - name: Match the tag to the package version
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          const tag = process.env.RELEASE_TAG;
          if (!/^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(tag) || tag !== `v${version}`) throw new Error('Tag must match package.json version');
          appendFileSync(process.env.GITHUB_OUTPUT, `tag=${tag}\n`);
          NODE
      - run: npm ci --no-audit --no-fund
      - run: npm run test:release
      - run: npm run export:release
      - run: node .github/scripts/verify-theme.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: author-theme-package
          path: |
            release/*-theme.tar.gz
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: author-theme-package
          path: release
      - name: Publish the verified author theme package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        run: |
          cd release
          sha256sum --check SHA256SUMS.txt
          cat > release-notes.md <<'NOTES'
          **博客作者请下载下方的 `*-theme.tar.gz` 主题包。**
          **Blog authors: download the `*-theme.tar.gz` theme package below.**

          GitHub 自动附带的 “Source code” 是完整仓库快照，包含开发资料，不是面向博客作者的主题包。
          GitHub's automatic “Source code” archives are full repository snapshots with developer materials.

          解压主题包后进入 `astro-theme-aero/`，运行 `npm ci` 和 `npm run dev`，按中英文文档配置博客。
          Extract the theme package, enter `astro-theme-aero/`, run `npm ci` and `npm run dev`, and follow the included guides.

          v1.4.0 将 Aero 主题的最低浏览器兼容目标扩展至 Windows 7 上的 Chrome 109 与 Firefox 115 ESR，现代浏览器继续使用同一份静态构建。主题色现预计算混色与 RGB 通道，替换旧浏览器不支持的 CSS 颜色语法；播放列表的浮层层级通过显式 class 同步，支持关闭动画和 Astro 跨页面导航。

          v1.4.0 extends Aero's browser compatibility target to Chrome 109 and Firefox 115 ESR on Windows 7 while retaining one static build for modern browsers. Theme colors now precompute blended colors and RGB channels instead of relying on unsupported CSS color syntax. The playlist uses explicit layering classes across closing animations and Astro page navigation.

          保留 v1.3.0 的 Windows Paint 风格调色板、Aero 播放列表和迁移后的 About 正文位置，以及现有 Blob 缓存与系统媒体控件。

          The Windows Paint-style palette, Aero playlist, About content location, Blob caching, and Media Session controls introduced in earlier releases remain available.

          升级后运行 npm ci，并从实际使用的同一份主题源码重建 Publisher 镜像，以匹配 package 文件。播放器设置继续使用现有音乐配置和静态歌单。

          After upgrading, run npm ci and rebuild the Publisher image from the exact theme source in use so the package files match. Continue using the existing music configuration and static playlist.

          The theme package follows ADR-0013: production theme/tools, default assets, author examples and guides; no tests, CI files or developer maintenance records. Verify the download with `SHA256SUMS.txt`.
          NOTES
          flags=(--verify-tag --title "Astro Theme Aero ${RELEASE_TAG}" --notes-file release-notes.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then flags+=(--prerelease); fi
          if gh release view "$RELEASE_TAG" --json tagName >/dev/null 2>&1; then
            echo 'A release already exists for this tag; refusing to overwrite published assets.' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" ./*-theme.tar.gz SHA256SUMS.txt "${flags[@]}"
